<section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6">
        <h2 class="text-sm font-bold text-white mb-4">Active Stock Inventory Ledger</h2>
        <table class="w-full text-left text-sm text-slate-400">
            <thead>
                <tr class="border-b border-slate-800 text-slate-500 text-[10px] font-bold uppercase">
                    <th class="pb-2">Product Details</th>
                    <th class="pb-2">Price</th>
                    <th class="pb-2">Stock</th>
                    <th class="pb-2 text-right">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr>
                    <form action="{% url 'executive_dashboard:quick_update_product' product.id %}" method="post">
                        {% csrf_token %}
                        <td class="py-2 text-slate-200 font-semibold">{{ product.name }}</td>
                        <td class="py-2"><input type="number" name="price" value="{{ product.price }}" step="0.01" class="w-16 bg-slate-950 border border-slate-800 rounded text-xs text-white p-1"></td>
                        <td class="py-2"><input type="number" name="stock_count" value="{{ product.stock_count }}" class="w-12 bg-slate-950 border border-slate-800 rounded text-xs text-white p-1"></td>
                        <td class="py-2 text-right"><button type="submit" class="bg-slate-800 text-xs px-2 py-1 rounded">Save</button></td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 h-fit">
        <h2 class="text-sm font-bold text-white mb-3">Deploy New Product</h2>
        <form action="{% url 'executive_dashboard:add_product' %}" method="post" enctype="multipart/form-data" class="space-y-2">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Item Name" class="w-full bg-slate-950 border border-slate-800 text-xs text-white rounded p-2" required>
            <select name="category" class="w-full bg-slate-950 border border-slate-800 text-xs text-slate-300 rounded p-2">
                {% for cat in categories %} <option value="{{ cat.id }}">{{ cat.name }}</option> {% endfor %}
            </select>
            <input type="number" name="price" placeholder="Price" step="0.01" class="w-full bg-slate-950 border border-slate-800 text-xs text-white rounded p-2" required>
            <input type="number" name="stock_count" placeholder="Initial Stock" class="w-full bg-slate-950 border border-slate-800 text-xs text-white rounded p-2" required>
            <input type="file" name="image" class="text-xs text-slate-400 w-full">
            <button type="submit" class="w-full bg-blue-600 font-bold text-xs py-2 rounded">Publish Item</button>
        </form>
    </div>
</section>
