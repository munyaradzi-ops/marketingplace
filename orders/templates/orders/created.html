{% extends 'core/base.html' %}

{% block title %}Order Placed Successfully{% endblock %}

{% block content %}
<div class="bg-white border border-gray-200 max-w-md mx-auto rounded-2xl p-8 text-center shadow-sm">
    <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">&check;</div>
    <h1 class="text-2xl font-black text-gray-900 mb-2">Thank You For Your Order!</h1>
    <p class="text-gray-600 text-sm mb-6">Your transaction was confirmed. Your record transaction tracking reference code ID is: <strong class="text-gray-900">#{{ order.id }}</strong>.</p>
    <a href="{% url 'core:index' %}" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-6 py-2.5 rounded-xl inline-block shadow-sm transition-colors">Continue Shopping</a>
</div>
{% endblock %}
