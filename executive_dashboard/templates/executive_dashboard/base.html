<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Console Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }
    </script>
</head>
<body class="text-slate-100 min-h-full bg-slate-950 font-sans antialiased">

    <!-- Global Suite Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/40 backdrop-blur-xl sticky top-0 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-base font-extrabold text-white tracking-tight">Marketplace Control Console</h1>
            <a href="{% url 'core:index' %}" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">&larr; Public Storefront</a>
        </div>
    </header>

    <!-- Main Content Box -->
    <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
